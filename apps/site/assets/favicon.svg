        stroke="#E8C87A" stroke-width="1.7" stroke-linecap="round" fill="none"/>
  <circle cx="11.8" cy="21.2" r="2.2" fill="#E8C87A"/>
  <circle cx="18" cy="19.8" r="2.2" fill="#E8C87A"/>
