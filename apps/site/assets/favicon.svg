<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="音乐播放器">
  <!-- 背景：深色圆角方块，保证在浅色/深色浏览器标签页上都看得清 -->
  <rect width="32" height="32" rx="7" fill="#0E1014"/>
  <!-- 六边形外框，和页面顶栏 logo 同一形状 -->
